---
apiVersion: platform.confluent.io/v1beta1
kind: Zookeeper
metadata:
  name: zookeeper
  namespace: destination
spec:
  replicas: 3
  image:
    application: confluentinc/cp-zookeeper:7.9.1
    init: confluentinc/confluent-init-container:2.11.1
  license:
    globalLicense: true
  dataVolumeCapacity: 1Gi
  logVolumeCapacity: 1Gi
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: destination
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:7.9.1
    init: confluentinc/confluent-init-container:2.11.1
  license:
    globalLicense: true
  dataVolumeCapacity: 1Gi
  dependencies:
    zookeeper:  
      endpoint: zookeeper.destination.svc.cluster.local:2181
  configOverrides:
    log4j:
      - log4j.logger.kafka.server.link=DEBUG, stdout 
      - log4j.additivity.kafka.server.link=false	
    server:
      - inter.broker.protocol.version=3.8
  metricReporter:
    enabled: true
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: kafka-rest
  namespace: destination
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    endpoint: http://kafka.destination.svc.cluster.local:8090
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: destination
spec:
  replicas: 1
  enableSchemaExporter: true
  image:
    application: confluentinc/cp-schema-registry:7.9.1
    init: confluentinc/confluent-init-container:2.11.1
  license:
    globalLicense: true
  dependencies:
    kafka:  
      bootstrapEndpoint: kafka.destination.svc.cluster.local:9071
