---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: in-cluster-test
  namespace: destination
spec:
  name: in-cluster-test
  replicas: 3
  partitionCount: 24
  configs:
    cleanup.policy: "delete"
  kafkaClusterRef:
    name: kafka
    namespace: destination
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: in-cluster-test-replicated
  namespace: destination
spec:
  name: in-cluster-test-replicated
  replicas: 3
  partitionCount: 3
  configs:
    cleanup.policy: "delete"
    retention.ms: "3600"
  kafkaClusterRef:
    name: kafka
    namespace: destination
---
apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: replicator-incluster
  namespace: destination
spec:
  class: io.confluent.connect.replicator.ReplicatorSourceConnector
  taskMax: 1
  configs:
    header.converter: io.confluent.connect.replicator.util.ByteArrayConverter
    key.converter: io.confluent.connect.replicator.util.ByteArrayConverter
    value.converter: io.confluent.connect.replicator.util.ByteArrayConverter
    # topic.whitelist: test-topic
    # topic.blacklist: doNotReplicate
    topic.regex: in-cluster-test
    topic.rename.format: ${topic}-replicated
    topic.auto.create: "false"
    topic.config.sync: "false"
    topic.preserve.partitions: "false"
    offset.topic.commit: "false"
    src.kafka.bootstrap.servers: kafka.destination.svc.cluster.local:9092
    dest.kafka.bootstrap.servers: kafka.destination.svc.cluster.local:9092
